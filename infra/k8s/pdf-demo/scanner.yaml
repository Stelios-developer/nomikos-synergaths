apiVersion: v1
kind: ConfigMap
metadata:
  name: scanner-config
data:
  clamd.conf: |
    TCPSocket 3310
    TCPAddr 0.0.0.0
    DatabaseDirectory /var/lib/clamav
    TemporaryDirectory /tmp
---
apiVersion: v1
kind: Service
metadata:
  name: clamav
spec:
  selector:
    app: pdf-scanner
  ports:
    - name: scanner
      port: 3310
      targetPort: 3310
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pdf-scanner
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pdf-scanner
  template:
    metadata:
      labels:
        app: pdf-scanner
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: scanner
          image: clamav/clamav:1.5.4
          imagePullPolicy: Never
          command: ['clamd', '--foreground', '--config-file=/config/clamd.conf']
          ports:
            - containerPort: 3310
          startupProbe:
            tcpSocket:
              port: 3310
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            tcpSocket:
              port: 3310
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 3310
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 1Gi
              ephemeral-storage: 64Mi
            limits:
              cpu: '2'
              memory: 2Gi
              ephemeral-storage: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: scratch
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: scanner-config
        - name: scratch
          emptyDir:
            sizeLimit: 128Mi
