name: Security gates
on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * 1"
permissions:
  contents: read
jobs:
  image-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        directory: [backend, security/pdf_worker, auth-service]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: { python-version: "3.12" }
      - name: Install checksum-pinned image scanner
        run: python scripts/security/install_trivy.py
      - name: Build exact source into a local image
        run: docker build --tag dmc-ci:${{ strategy.job-index }} ${{ matrix.directory }}
      - name: Test exact auth image without network or live credentials
        if: matrix.directory == 'auth-service'
        run: python scripts/integration_auth_image.py dmc-ci:${{ strategy.job-index }}
      - name: Verify exact backend source and isolated imports
        if: matrix.directory == 'backend'
        run: python scripts/integration_backend_image.py dmc-ci:${{ strategy.job-index }}
      - name: Test exact PDF image with synthetic Greek and English OCR
        if: matrix.directory == 'security/pdf_worker'
        run: |
          python -m venv .tools/pdf-test
          .tools/pdf-test/bin/python -m pip install --require-hashes --only-binary=:all: -r security/pdf_worker/requirements-linux-py312.lock
          .tools/pdf-test/bin/python scripts/integration_pdf_image.py dmc-ci:${{ strategy.job-index }}
      - name: Scan OS and language inventory, including unfixed advisories
        run: |
          mkdir -p output/security
          .tools/trivy/trivy image --quiet --scanners vuln --format json --output output/security/image.json dmc-ci:${{ strategy.job-index }}
          .tools/trivy/trivy image --quiet --format cyclonedx --output output/security/image.cdx.json dmc-ci:${{ strategy.job-index }}
          python scripts/security/image_gate.py output/security/image.json output/security/image.gate.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: image-security-${{ strategy.job-index }}
          path: |
            output/security/image.gate.json
            output/security/image.cdx.json
          retention-days: 7
  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        directory: [frontend, auth-service]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version: "22", package-manager-cache: false }
      - run: npm ci --ignore-scripts
        working-directory: ${{ matrix.directory }}
      - name: Generate a dependency SBOM, not an image attestation
        working-directory: ${{ matrix.directory }}
        run: |
          mkdir -p ../output/security
          npm sbom --sbom-format cyclonedx > ../output/security/${{ matrix.directory }}.cdx.json
      - run: npm audit --audit-level=high
        working-directory: ${{ matrix.directory }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: npm-inventory-${{ matrix.directory }}
          path: output/security/*.cdx.json
          retention-days: 7
  python-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        directory: [backend, security/pdf_worker]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: { python-version: "3.12" }
      - name: Resolve only the project dependencies into an isolated environment
        run: |
          python -m venv ${{ matrix.directory }}/.venv
          ${{ matrix.directory }}/.venv/bin/python -m pip install --upgrade pip==26.2.2
          ${{ matrix.directory }}/.venv/bin/python -m pip install --require-hashes --only-binary=:all: -r ${{ matrix.directory }}/requirements-linux-py312.lock
      - name: Explicitly approved project-only OSV audit; no suppression
        run: ${{ matrix.directory }}/.venv/bin/python scripts/security/audit_python.py --allow-osv
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: python-security-${{ strategy.job-index }}
          path: output/security/python-audit*.json
          retention-days: 7
  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: { python-version: "3.11" }
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
        with:
          output: output/codeql
          upload: false
      - name: Fail on high security/error findings; export no source snippets
        run: |
          found=0
          for report in output/codeql/*.sarif; do
            [ -f "$report" ] || continue
            found=1
            python scripts/security/sarif_gate.py "$report" "output/security/codeql-${{ matrix.language }}.gate.json"
          done
          [ "$found" -eq 1 ]
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: static-security-${{ matrix.language }}
          path: output/security/*.gate.json
          retention-days: 7
