# Render Blueprint. Deploy via Render dashboard -> New -> Blueprint,
# pointing at this repo. See ../README.md for the free-tier caveats
# (no persistent disk, 512MB RAM) that affect ChromaDB storage and OCR.
services:
  - type: web
    name: document-rag-assistant-api
    runtime: python
    plan: free          # bump to "starter" (or higher) for a real deploy —
                         # see README for why the free plan is not enough here
    buildCommand: pip install -r requirements.txt
    # --proxy-headers + --forwarded-allow-ips so slowapi's per-IP rate limiter
    # reads the real visitor IP from X-Forwarded-For instead of Render's edge
    # proxy IP — without this every visitor would silently share one bucket.
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: anthropic
      - key: ALLOWED_ORIGINS
        value: https://your-frontend.vercel.app
      - key: CHUNK_SIZE
        value: "500"
      - key: CHUNK_OVERLAP
        value: "50"
      - key: MAX_CHUNKS_PER_QUERY
        value: "5"
      - key: CHROMA_PERSIST_DIR
        value: /var/data/chroma_db
      - key: EVAL_DB_PATH
        value: /var/data/evaluation.db
      - key: API_KEY
        sync: false
      # AGENT_API_KEY gates ONLY code execution (the Action Agent) —
      # falls back to API_KEY if unset. Set this to a DIFFERENT value than
      # API_KEY if you want the rest of the app public while keeping code
      # execution private to yourself.
      - key: AGENT_API_KEY
        sync: false
      - key: MAX_UPLOAD_SIZE_MB
        value: "20"
      - key: RATE_LIMIT_QUERY
        value: "20/minute"
      - key: RATE_LIMIT_UPLOAD
        value: "10/minute"
      - key: RATE_LIMIT_AGENT
        value: "10/minute"
      - key: RATE_LIMIT_SUPERVISOR
        value: "5/minute"
      - key: RATE_LIMIT_PANEL
        value: "5/minute"
      - key: RATE_LIMIT_DEBATE
        value: "5/minute"
      - key: RATE_LIMIT_RESEARCH
        value: "8/minute"
      - key: RATE_LIMIT_AUDIT
        value: "15/minute"
      - key: LOG_LEVEL
        value: "INFO"
    disk:
      name: rag-data
      mountPath: /var/data
      sizeGB: 1
