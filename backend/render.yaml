services:
  - type: web
    name: document-rag-assistant-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # Persistent source/case storage requires a paid disk-capable plan.
    plan: starter
    envVars:
      - key: PORT
        value: "8000"
      - key: HF_HOME
        value: /var/data/model-cache
      - key: ANALYSIS_DISPATCH_ENABLED
        value: "true"
      - key: ANALYSIS_DISPATCH_DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: anthropic
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: APP_ENV
        value: production
      - key: AUTH_REQUIRED
        value: "true"
      - key: REQUIRE_VERIFIED_EMAIL
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: BETTER_AUTH_SECRET
        sync: false
      - key: AUTH_COOKIE_PREFIX
        value: nexus
      - key: VECTOR_DATABASE_URL
        sync: false
      - key: EMBEDDING_DIMENSIONS
        value: "384"
      - key: EVAL_DB_PATH
        value: /var/data/evaluation.db
      - key: DOCUMENT_CASE_DB_PATH
        value: /var/data/document_cases.db
      - key: ADMIN_API_KEY
        sync: false
      - key: N8N_WEBHOOK_API_KEY
        sync: false
      - key: N8N_ORCHESTRATOR_URL
        sync: false
      - key: PDF_STORAGE_DIR
        value: /var/data/pdfs
      # A separately deployed, private PDF safety service is required. This
      # Render blueprint alone is intentionally not a production release.
      - key: PDF_SECURITY_URL
        sync: false
      - key: PDF_SECURITY_TOKEN
        sync: false
      - key: OBSERVABILITY_DB_PATH
        value: /var/data/observability.db
      - key: MAX_UPLOAD_SIZE_MB
        value: "20"
      - key: MAX_PDF_PAGES
        value: "250"
      - key: MAX_DOCUMENTS_PER_USER
        value: "100"
      - key: MAX_STORAGE_MB_PER_USER
        value: "500"
      - key: RATE_LIMIT_QUERY
        value: "20/minute"
      - key: RATE_LIMIT_UPLOAD
        value: "10/minute"
      - key: RATE_LIMIT_SUPERVISOR
        value: "5/minute"
      - key: RATE_LIMIT_PANEL
        value: "5/minute"
      - key: RATE_LIMIT_RESEARCH
        value: "8/minute"
      - key: RATE_LIMIT_AUDIT
        value: "15/minute"
      - key: RATE_LIMIT_INTELLIGENCE
        value: "4/minute"
      - key: LOG_LEVEL
        value: INFO
    disk:
      name: rag-data
      mountPath: /var/data
      sizeGB: 1
