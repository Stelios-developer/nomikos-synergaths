services:
  postgres:
    # Match the locally verified image; database upgrades require a separate
    # consistent PostgreSQL backup and migration/restore rehearsal.
    image: postgres:16-alpine@sha256:4e6e670bb069649261c9c18031f0aded7bb249a5b6664ddec29c013a89310d50
    environment:
      POSTGRES_DB: nexus_auth
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus-local-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - nexus-auth-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus_auth"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth:
    build: .
    env_file: .env
    environment:
      AUTH_HOST: 0.0.0.0
      # This compose is localhost development, not a production deployment.
      NODE_ENV: development
      APP_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:3001:3001"

volumes:
  nexus-auth-postgres:
